name: Deploy

# Publishes the repository root to GitHub Pages, gated on the audit.
#
# The deployable artefact is a single index.html with no build step, so this
# workflow does exactly three things: verify, upload the root, deploy.
#
# Enabling: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit (deploy gate)
        run: node scripts/audit.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The root is published as-is: index.html is the application, while
          # scripts/ and docs/ are inert static files that are never imported.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
